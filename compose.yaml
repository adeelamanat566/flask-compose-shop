services:
  flask:
    build: .
    container_name: flask-shop
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: adeel
      MYSQL_DATABASE: shop
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: shop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: adeel
      MYSQL_DATABASE: shop
    volumes:
      - mysql-data:/var/lib/mysql
     
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
